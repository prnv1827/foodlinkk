{% extends 'templates/base.html' %}
{% block title %}Reset password - FoodLink{% endblock %}
{% block main_class %}flex flex-col items-center py-10 px-4{% endblock %}
{% block content %}
    <h1 class="text-3xl font-bold mb-6">Choose a new password</h1>
    <form method="POST" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if error %}<p class="text-red-600 text-sm">{{ error }}</p>{% endif %}
        <input type="password" name="password" placeholder="New password (8+ characters, letter + number)" required class="w-full border p-3 rounded">
        <input type="password" name="confirm" placeholder="Confirm new password" required class="w-full border p-3 rounded">
        <button type="submit" class="bg-green-500 text-white w-full py-3 rounded hover:bg-green-600">Update password</button>
    </form>
{% endblock %}
