{% extends 'templates/base.html' %}
{% block title %}Log in - FoodLink{% endblock %}
{% block main_class %}flex flex-col items-center py-10 px-4{% endblock %}
{% block content %}
    <h1 class="text-3xl font-bold mb-6">Log in 🍱</h1>
    <form method="POST" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="email" name="email" value="{{ email }}" placeholder="Email" required autofocus class="w-full border p-3 rounded">
        <input type="password" name="password" placeholder="Password" required class="w-full border p-3 rounded">
        <button type="submit" class="bg-green-500 text-white w-full py-3 rounded hover:bg-green-600">Log in</button>
        <p class="text-sm text-center"><a href="/forgot" class="text-blue-600 hover:underline">Forgot password?</a></p>
    </form>
    <p class="mt-6 text-sm">New to FoodLink? <a href="/signup" class="text-green-700 hover:underline">Create an account</a></p>
{% endblock %}
